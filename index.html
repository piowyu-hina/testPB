<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eee7d9" />
    <title>testPB</title>
    <link rel="icon" href="assets/Adventurer.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="home" class="home" aria-label="主畫面">
      <header class="home-header">
        <span class="brand">testPB</span><span class="home-mark" aria-hidden="true">✦</span>
      </header>
      <section class="home-stage" aria-label="冒險者">
        <div class="portrait-display">
          <span class="portrait-disc" aria-hidden="true"></span>
          <img id="home-portrait" alt="冒險者立繪" draggable="false" />
        </div>
        <div class="home-details">
          <span class="eyebrow">旅途的起點</span>
          <h1>冒險者</h1>
          <div class="hero-token">
            <img id="hero-token" alt="棋盤上的冒險者" draggable="false" /><span>你的棋子</span>
          </div>
          <button id="start-game" class="primary-button" type="button" tabindex="-1">
            <span id="start-label">出發</span><span aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </main>
    <main class="game" id="game" aria-label="testPB 戰鬥房間" hidden>
      <header class="heading">
        <button
          type="button"
          id="back-home"
          class="quiet-button"
          tabindex="-1"
          aria-label="返回主畫面"
        >
          ‹ 主畫面
        </button>
        <span id="turn">第 1 回合</span>
      </header>
      <div class="status">
        <div id="health" class="health" aria-label="生命"></div>
        <div id="actions" class="actions" aria-label="剩餘行動"></div>
      </div>
      <section class="board-shell" aria-label="棋盤">
        <div class="board" id="board">
          <div class="tiles" id="tiles"></div>
          <div class="actors" id="actors"></div>
          <div class="actor hero ghost" id="ghost" hidden>
            <img alt="落點預覽" draggable="false" />
          </div>
        </div>
      </section>
      <section class="controls" aria-label="手牌與回合">
        <div class="hand" id="hand"></div>
        <button type="button" class="end-turn" id="end-turn" tabindex="-1" aria-label="結束回合">
          <span class="end-icon"
            ><svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M10 12 26 24 10 36ZM25 12 41 24 25 36Z" /></svg></span
          ><span id="end-label">結束回合</span>
        </button>
      </section>
      <div class="hint" id="hint" aria-live="polite"></div>
    </main>
    <div
      class="modal"
      id="result"
      role="dialog"
      aria-modal="true"
      aria-labelledby="result-title"
      hidden
    >
      <div class="result-panel">
        <h2 id="result-title"></h2>
        <button type="button" id="replay" tabindex="-1">再來一局</button>
        <button type="button" id="result-home" class="quiet-button" tabindex="-1">回主畫面</button>
      </div>
    </div>
    <noscript>請使用已啟用 JavaScript 的瀏覽器開啟。</noscript>
  </body>
</html>
