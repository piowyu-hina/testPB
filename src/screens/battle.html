    <main class="game" id="game" aria-label="testPB 戰鬥房間">
      <header class="heading">
        <button
          type="button"
          id="back-home"
          class="quiet-button"
          tabindex="-1"
          aria-label="返回村莊"
        >
          ‹ 村莊
        </button>
        <div class="heading-tools">
          <span id="turn">第 1 回合</span
          ><button
            class="theme-toggle"
            type="button"
            tabindex="-1"
            aria-label="切換為淺色背景"
          ></button>
        </div>
      </header>
      <div class="status">
        <div id="health" class="health" aria-label="生命"></div>
        <div id="journey-progress" class="journey-progress" aria-label="房間進度"></div>
        <div id="actions" class="actions" aria-label="剩餘行動"></div>
      </div>
      <section class="board-shell" aria-label="棋盤">
        <div class="board" id="board">
          <div class="tiles" id="tiles"></div>
          <div class="actors" id="actors"></div>
          <div class="actor hero ghost" id="ghost" hidden>
            <img alt="落點預覽" draggable="false" />
          </div>
        </div>
      </section>
      <section class="controls" aria-label="手牌與回合">
        <div class="hand" id="hand"></div>
        <button type="button" class="end-turn" id="end-turn" tabindex="-1" aria-label="結束回合">
          <span class="end-icon"
            ><svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M10 12 26 24 10 36ZM25 12 41 24 25 36Z" /></svg></span
          ><span id="end-label">結束回合</span>
        </button>
      </section>
      <div class="hint" id="hint" aria-live="polite"></div>
      <aside id="enemy-info" class="enemy-info" aria-label="怪物技能" hidden>
        <button id="enemy-info-close" type="button" tabindex="-1" aria-label="關閉怪物說明">×</button>
        <strong data-enemy-title></strong>
        <p data-enemy-current></p>
        <p data-enemy-cycle></p>
        <small>未選牌時點怪物，可固定顯示說明。</small>
      </aside>
    </main>
    <div
      class="modal"
      id="result"
      role="dialog"
      aria-modal="true"
      aria-labelledby="result-title"
      hidden
    >
      <div class="result-panel">
        <h2 id="result-title"></h2>
        <button type="button" id="replay" tabindex="-1">再來一局</button>
        <button type="button" id="result-home" class="quiet-button" tabindex="-1">返回村莊</button>
      </div>
    </div>
