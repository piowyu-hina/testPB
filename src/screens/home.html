<main id="home" class="village" aria-label="村莊">
  <img id="village-art" class="village-art" alt="森林邊的村莊，廣場中央是公會，右側城門通往森林" draggable="false" />
  <div class="village-shade"></div>
  <header class="village-header">
    <div><p class="scene-eyebrow">冒險的起點</p><h1>林畔村莊</h1></div>
    <button id="open-settings" class="scene-button" type="button" tabindex="-1"><span aria-hidden="true">⚙</span> 設定</button>
  </header>
  <figure class="village-portrait">
    <img id="home-portrait" alt="露雪立繪" draggable="false" />
  </figure>
  <footer class="village-footer">
    <div class="village-footer-info"><span class="village-location">林畔廣場</span><p id="village-status">準備好了，就向森林出發吧。</p></div>
    <button id="open-dungeons" class="footer-dungeon-button" type="button" tabindex="-1"><strong>地下城</strong><small id="dungeon-entry-note">探索森林遺跡</small></button>
  </footer>
  <dialog id="village-settings" class="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-heading"><h2 id="settings-title">設定</h2><button id="close-settings" class="quiet-button" type="button" tabindex="-1">關閉</button></div>
    <div class="settings-row"><div><strong>介面主題</strong><p>切換淺色／深色介面</p></div><button class="theme-toggle" type="button" tabindex="-1" aria-label="切換背景主題"></button></div>
    <div class="settings-row"><div><strong>戰鬥音效</strong><p>移動、攻擊與擊殺</p></div><button id="sound-toggle" class="sound-toggle" type="button" tabindex="-1" aria-pressed="true">開</button></div>
    <p class="settings-note">冒險進度僅保留於本次開啟期間。關閉遊戲後，將重新出發。</p>
  </dialog>
</main>
