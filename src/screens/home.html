    <main id="home" class="home" aria-label="主畫面">
      <header class="home-header">
        <span class="brand">testPB</span
        ><button
          class="theme-toggle"
          type="button"
          tabindex="-1"
          aria-label="切換為淺色背景"
        ></button>
      </header>
      <section class="home-stage" aria-label="角色展示">
        <div class="portrait-display">
          <span class="portrait-disc" aria-hidden="true"></span>
          <img id="home-portrait" alt="莉娜立繪" draggable="false" />
        </div>
        <div class="home-details">
          <span class="eyebrow">旅途的起點</span>
          <h1 id="hero-name">莉娜</h1>
          <button id="start-game" class="primary-button" type="button" tabindex="-1">
            <span id="start-label">出發</span><span aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </main>
